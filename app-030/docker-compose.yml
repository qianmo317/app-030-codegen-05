services:
  app-030:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-030-codegen-05:latest
    container_name: app-030-codegen-05
    restart: unless-stopped
    ports:
      - "8150:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
